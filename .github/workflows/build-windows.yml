name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Comprobar que los modulos importan
        run: python -c "import core.audio_utils, core.lyrics, core.player; print('imports ok')"

      - name: Build with PyInstaller
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed --name MusicHelper
          --collect-all customtkinter
          --collect-all librosa
          --collect-all numba
          --collect-all llvmlite
          --collect-all soundfile
          --collect-all sounddevice
          --collect-all imageio_ffmpeg
          --collect-submodules yt_dlp
          main.py

      - name: Comprimir carpeta
        shell: pwsh
        run: Compress-Archive -Path dist/MusicHelper -DestinationPath MusicHelper-Windows.zip

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MusicHelper-Windows
          path: dist/MusicHelper
          retention-days: 30

      - name: Subir al Release (solo si es un release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: MusicHelper-Windows.zip
